name: Source Next CI

on:
  push:
    branches:
      - maint/3.x
    paths:
      - 'source-next/**'
      - '.gitmodules'
      - '.github/workflows/source-next.yaml'
  pull_request:
    paths:
      - 'source-next/**'
      - '.gitmodules'
      - '.github/workflows/source-next.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-next-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify DataBackup 3.x
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: source-next

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Install native toolchain
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;30.0.16248370" "cmake;3.22.1"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Report binary sizes
        run: |
          du -h app/build/outputs/apk/debug/*.apk || true
          find app/build -type f -name '*.so' -exec du -h {} + | sort -h || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DataBackup-3.x-debug
          if-no-files-found: error
          path: source-next/app/build/outputs/apk/debug/*.apk

      - name: Rustic tests
        run: cargo test --manifest-path native/src/main/jni/rustic/Cargo.toml

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-next-reports
          if-no-files-found: ignore
          path: |
            source-next/**/build/reports/**
            source-next/**/build/test-results/**
            source-next/native/src/main/jni/rustic/Cargo.lock
